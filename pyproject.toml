[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "path-sift"
version = "0.1.0"
description = "Find files by typing a few letters of their name, with size and age filters"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "landry-some" }]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
path-sift = "path_sift.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
